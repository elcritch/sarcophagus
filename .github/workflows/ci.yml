name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.10'
      - name: Cache atlas deps
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-atlas-${{ hashFiles('sarcophagus.nimble') }}
          restore-keys: |
            ${{ runner.os }}-atlas-${{ hashFiles('sarcophagus.nimble') }}
      - run: echo "$HOME/.nimble/bin" >> "$GITHUB_PATH"
      - run: mkdir /tmp/atlas
      - run: git clone -b 'experiment/packager' https://github.com/nim-lang/atlas
      - run: cd atlas && nim buildRelease
      - run: ./atlas/bin/atlas -v
      - run: ./atlas/bin/atlas -t --feature:cbor --feature:jsony --feature:msgpack --feature:dev install
      - run: nim test
