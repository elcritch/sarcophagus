name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nim-version: ['2.2.10', '2.2.12']
    steps:
      - uses: actions/checkout@v4
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ matrix.nim-version }}
      - name: Cache atlas deps
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-atlas-${{ hashFiles('sarcophagus.nimble') }}
          restore-keys: |
            ${{ runner.os }}-atlas-${{ hashFiles('sarcophagus.nimble') }}
      - run: echo "$HOME/.nimble/bin" >> "$GITHUB_PATH"
      - run: curl -fsSL https://raw.githubusercontent.com/nim-lang/atlas/HEAD/install.sh | bash -
      - run: atlas -v
      - run: atlas install -t --feature:cbor --feature:jsony --feature:msgpack --feature:dev
      - run: nim test
